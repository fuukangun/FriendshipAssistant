name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, such as 1.0.1
        required: true
        default: 1.0.1
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate game dependencies
        shell: bash
        run: |
          game_path="$HOME/Library/Application Support/Steam/steamapps/common/Stardew Valley/Contents/MacOS"
          for file in Stardew\ Valley.dll StardewModdingAPI.dll MonoGame.Framework.dll xTile.dll; do
            if [[ ! -f "$game_path/$file" ]]; then
              echo "Missing game dependency: $game_path/$file" >&2
              exit 1
            fi
          done

          echo "GAME_PATH=$game_path" >> "$GITHUB_ENV"

      - name: Set manifest version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          /usr/bin/python3 - "$RELEASE_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path("manifest.json")
          data = json.loads(path.read_text())
          data["Version"] = sys.argv[1]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore FriendshipAssistant.Tests.csproj

      - name: Run tests
        run: dotnet test FriendshipAssistant.Tests.csproj --no-restore -v minimal

      - name: Build release
        run: dotnet build FriendshipAssistant.csproj -c Release --no-restore -p:GamePath="$GAME_PATH"

      - name: Package mod
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          package_dir="artifacts/release/FriendshipAssistant-$RELEASE_VERSION"
          package_file="artifacts/release/FriendshipAssistant-$RELEASE_VERSION.zip"
          rm -rf "$package_dir" "$package_file"
          mkdir -p "$package_dir/i18n"
          cp "bin/Release/net6.0/FriendshipAssistant.dll" "$package_dir/"
          cp manifest.json "$package_dir/"
          cp i18n/default.json i18n/zh.json "$package_dir/i18n/"
          (
            cd artifacts/release
            zip -qr "FriendshipAssistant-$RELEASE_VERSION.zip" "FriendshipAssistant-$RELEASE_VERSION"
          )
          shasum -a 256 "$package_file" > "$package_file.sha256"
          unzip -l "$package_file"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FriendshipAssistant-${{ steps.version.outputs.version }}
          path: |
            artifacts/release/FriendshipAssistant-${{ steps.version.outputs.version }}.zip
            artifacts/release/FriendshipAssistant-${{ steps.version.outputs.version }}.zip.sha256

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FriendshipAssistant ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/release/FriendshipAssistant-${{ steps.version.outputs.version }}.zip
            artifacts/release/FriendshipAssistant-${{ steps.version.outputs.version }}.zip.sha256
